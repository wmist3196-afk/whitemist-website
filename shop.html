<!doctype html>
<html lang="en">
<head>
<script>if(location.protocol==='file:'){document.write('<div style="font:16px/1.6 system-ui;max-width:560px;margin:15vh auto;padding:0 24px"><h1 style="font-size:24px">Open this site through the local server</h1><p>This page was opened as a file, so styles and scripts cannot load. Run <b>node scripts/dev-server.mjs</b> (or double-click start.command / start.bat) and open <b>http://localhost:4173</b>.</p></div>');}</script>
<title>Shop | White Mist</title>
<meta name="description" content="Shop White Mist liquid detergent, refill pouches, fabric conditioner, stain booster and saver combos.">
<!--#include head-->
</head>
<body>
<!--#include header-->
<main id="main">
<div class="wrap">
  <nav class="crumbs" aria-label="Breadcrumb"><a href="/">Home</a> / <span id="crumb-shop" aria-current="page">Shop</span></nav>
  <div class="page-head">
    <h1 class="page-title" id="shop-title">Shop</h1>
    <p class="muted" id="shop-sub" style="margin-top:8px"></p>
  </div>

  <nav class="cat-tabs" id="cat-tabs" aria-label="Categories"></nav>

  <form class="shop-tools" id="tools" role="search" onsubmit="return false">
    <div class="field grow"><label for="q">Search</label><input id="q" name="q" type="search" placeholder="Search products" autocomplete="off"></div>
    <div class="field"><label for="fragrance">Fragrance</label>
      <select id="fragrance" name="fragrance"><option value="">All fragrances</option><option value="ocean">Ocean Fresh</option><option value="floral">Floral Bloom</option><option value="citrus">Citrus Sunshine</option><option value="rose">Pink Rose</option></select></div>
    <div class="field"><label for="sort">Sort by</label>
      <select id="sort" name="sort"><option value="featured">Featured</option><option value="price-asc">Price: low to high</option><option value="price-desc">Price: high to low</option><option value="saving">Biggest saving</option></select></div>
  </form>

  <div class="result-meta"><span id="count" aria-live="polite"></span><button type="button" class="link-btn" id="clear" hidden>Clear filters</button></div>
  <div class="grid" id="grid" aria-busy="true"></div>
  <div class="empty" id="empty" hidden>
    <p class="display" style="font-size:28px">Nothing matches that.</p>
    <p class="muted" style="margin-top:8px">Try a different search or clear the filters.</p>
  </div>
</div>
</main>
<!--#include footer-->
<script type="module" src="/js/shell.js"></script>
<script type="module" src="/js/pages/shop.js"></script>
</body>
</html>
